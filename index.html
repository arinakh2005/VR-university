<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>AR.js Box</title>
   <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
   <script src="https://rawcdn.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
   <a-entity light="type: ambient; color: #ffffff"></a-entity>
   <a-marker type="pattern" url="pattern.patt">
      <a-box position="0 0.5 0" color="blue"></a-box>
   </a-marker>
   <a-entity camera></a-entity>
</a-scene>
</body>
</html>
