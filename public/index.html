<!DOCTYPE html>
<html>
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
      <title>PR-03 Corrugated Sphere</title>
      <style>
         body {
            background-color: #EEEEEE;
         }
         .form-label {
            margin-bottom: 0 !important;
         }
      </style>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
      <script src="Utils/trackball-rotator.js"></script>
      <script src="Utils/m4.js"></script>
      <script src="shader.gpu"></script>
      <script src="background-shader.gpu"></script>
      <script src="audio-sphere-model.js" type="module"></script>
      <script src="model.js" type="module"></script>
      <script src="stereo-camera.js" type="module"></script>
      <script src="main.js" type="module"></script>
   </head>
   <body>
   <div class="container text-center my-2">
      <h2>Corrugated Sphere</h2>
      <p id="message">Drag your mouse on the model to rotate it.<br></p>
   </div>

   <div class="container d-flex justify-content-center">
      <div id="canvas-holder" class="me-3">
         <canvas width="600" height="600" id="webglcanvas"></canvas>
      </div>
      <div id="settings-section" class="py-1 px-3">
         <div class="mb-2">
            <label for="convergence" class="form-label">Convergence:</label>
            <input type="number" class="form-control" id="convergence" min="0" max="50" step="1" value="20">
         </div>
         <div class="mb-2">
            <label for="eyeSeparation" class="form-label">Eye Separation:</label>
            <input type="number" class="form-control" id="eyeSeparation" min="0.1" max="5" step="0.1" value="2">
         </div>
         <div class="mb-2">
            <label for="fov" class="form-label">Field of View (FOV):</label>
            <input type="number" class="form-control" id="fov" min="0" max="180" step="1" value="45">
         </div>
         <div class="mb-21">
            <label for="nearClippingDistance" class="form-label">Near Clipping Distance:</label>
            <input type="number" class="form-control" id="nearClippingDistance" min="0.1" max="10" step="0.5" value="6.5">
         </div>
         <div class="mb-2">
            <label for="farClippingDistance" class="form-label">Far Clipping Distance:</label>
            <input type="number" class="form-control" id="farClippingDistance" min="0" max="2000" step="10" value="2000">
         </div>
         <div class="mb-2">
            <label for="audioFile" class="form-label">Select Audio File:</label>
            <input type="file" class="form-control" id="audioFile" accept=".mp3, .ogg">
         </div>
         <div class="mb-2">
            <label>
               <input type="checkbox" id="filterToggle"> Band‑pass filter
            </label>
         </div>
      </div>
   </div>
   </body>
</html>
