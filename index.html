<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8" />
   <title>AR.js Cube</title>
   <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
   <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
   <a-entity light="type: ambient; color: #ffffff"></a-entity>
   <a-marker type="pattern" patternUrl="https://raw.githubusercontent.com/arinakh2005/VR-university/ControlTask/pattern-parrot.patt.txt">
      <a-box position="0 0.5 0" color="blue"></a-box>
   </a-marker>
   <a-entity camera></a-entity>
</a-scene>
</body>
</html>
