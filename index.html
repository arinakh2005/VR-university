<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8" />
   <title>AR.js Cube</title>
   <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
   <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.0.1/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;">
   <a-camera position="0 0 0" look-controls-enabled="false"></a-camera>
   <a-marker type="pattern" url="pattern-umbrella.patt">
      <a-box position="0 1 0" scale="200 200 200" color="blue"></a-box>
   </a-marker>
   <a-entity camera></a-entity>
</a-scene>
</body>
</html>
