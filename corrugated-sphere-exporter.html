<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Corrugated Sphere Exporter</title>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
          }
        }
    </script>
</head>

<body>
<h2>Corrugated Sphere Exporter</h2>
<button id="exportBtn">Export .glb</button>
<script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/examples/jsm/exporters/GLTFExporter.js';

    function createCorrugatedSphereGeometry(radius, corrugation, waveCount, segmentsU, segmentsV) {
        const vertices = [];
        const indices = [];

        for (let i = 0; i <= segmentsU; i++) {
            const phi = (i / segmentsU) * 2 * Math.PI;
            for (let j = 0; j <= segmentsV; j++) {
                const v = (j / segmentsV) * Math.PI;
                const cosV = Math.cos(v);
                const sinV = Math.sin(v);
                const similarPart = radius * cosV + corrugation * (1 - sinV) * Math.cos(waveCount * phi);
                const x = similarPart * Math.cos(phi);
                const y = similarPart * Math.sin(phi);
                const z = radius * sinV;
                vertices.push(x, y, z);
            }
        }

        for (let i = 0; i < segmentsU; i++) {
            for (let j = 0; j < segmentsV; j++) {
                const point = i * (segmentsV + 1) + j;
                const nextRow = point + (segmentsV + 1);
                indices.push(point, nextRow, point + 1);
                indices.push(point + 1, nextRow, nextRow + 1);
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    function exportModel() {
        const scene = new THREE.Scene();
        const geometry = createCorrugatedSphereGeometry(1, 0.3, 5, 64, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0x3366ff });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const exporter = new GLTFExporter();
        exporter.parse(scene, (result) => {
            const blob = new Blob([result], { type: 'model/gltf-binary' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'corrugated-sphere.glb';
            link.click();
        }, { binary: true });
    }

    document.getElementById('exportBtn').addEventListener('click', exportModel);
</script>
</body>
</html>
